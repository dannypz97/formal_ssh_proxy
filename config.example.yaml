# SSH Proxy configuration
# Copy this file, fill in the values, and pass the path with -config.
# Relative paths are resolved against the proxy's working directory.
# Unknown keys are rejected, so typos fail at startup.

# Address the proxy listens on (default: 0.0.0.0:2022).
listen: "0.0.0.0:2022"

# The proxy's own SSH host key (unencrypted private key).
# Generate one with: ssh-keygen -t ed25519 -f host_key -N ""
host_key: "host_key"

# Upstream SSH server the proxy forwards connections to. These values match
# the test upstream started by `docker compose up upstream` (localhost:2222).
upstream:
  host: "localhost"
  port: 2222
  username: "testuser"
  # Password authentication:
  password: "testpass"
  # Public-key authentication (tried before the password when both are set):
  # private_key: "upstream_key"
  # Recommended: verify the upstream host key against an OpenSSH known_hosts
  # file. Without it, the host key is not checked (a warning is logged).
  # e.g. ssh-keyscan -p 2222 localhost > known_hosts
  # known_hosts: "known_hosts"

# Users allowed to connect to the proxy.
# A user needs a password, a public key, or both. When both are configured,
# clients try public-key auth first and may fall back to the password.
users:
  - username: "alice"
    password: "alice-secret"
    # OpenSSH authorized_keys-format file (one or more keys, e.g. a .pub file):
    # public_key: "alice.pub"

  - username: "bob"
    password: "bob-secret"

# Directory where session logs are written (default: ./logs).
# Created at startup if it does not exist.
log_dir: "./logs"

# Optional: LLM-based security assessment of each session.
# Leave api_key empty to disable. The key is checked with the provider at
# startup; a rejected key disables the feature.
llm:
  # "anthropic" (default) or "openai".
  provider: "anthropic"
  api_key: ""
  # Optional; defaults to claude-opus-5 (anthropic) or gpt-4o (openai).
  # Must match the provider, e.g. "claude-opus-5", "claude-opus-4-6",
  # "claude-sonnet-5" (anthropic) or "gpt-4o" (openai).
  model: "claude-opus-5"
  # Max transcript size sent to the LLM, in bytes (default: 100000).
  # max_transcript_chars: 100000
