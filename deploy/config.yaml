# Docker Compose test environment configuration.
# Keys under /etc/ssh-proxy/keys are created by deploy/generate-keys.sh.
listen: "0.0.0.0:2022"
host_key: "/etc/ssh-proxy/keys/host_key"

upstream:
  host: "upstream"
  port: 22
  username: "testuser"
  # Public-key auth to the upstream; the password is the fallback.
  private_key: "/etc/ssh-proxy/keys/upstream_client_key"
  password: "testpass"
  # Verify the upstream's host key.
  known_hosts: "/etc/ssh-proxy/keys/known_hosts"

users:
  # Public key first, password as a fallback.
  - username: "alice"
    public_key: "/etc/ssh-proxy/keys/alice_key.pub"
    password: "alice123"
  # Password only.
  - username: "bob"
    password: "bob123"

log_dir: "/var/log/ssh-proxy"

# LLM summaries are disabled until an API key is set.
# llm:
#   provider: "anthropic"
#   api_key: "sk-ant-..."
